<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和控代理事项闭环看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;min-width:1000px;}
/* Header */
.header{background:linear-gradient(135deg,#1a5fa8,#0d3d72);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:20px;font-weight:700;letter-spacing:1px;}
.header-right{display:flex;align-items:center;gap:10px;font-size:13px;}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;}
.btn-primary{background:#1a73e8;color:#fff;}
.btn-primary:hover{background:#1558c0;}
.btn-success{background:#34a853;color:#fff;}
.btn-success:hover{background:#2a8a44;}
.btn-danger{background:#ea4335;color:#fff;}
.btn-danger:hover{background:#c5352a;}
.btn-outline{background:#fff;color:#555;border:1px solid #ccc;}
.btn-outline:hover{background:#f5f5f5;}
.btn-sm{padding:4px 10px;font-size:12px;}
/* Summary cards */
.summary{padding:16px 24px 0;display:flex;gap:12px;flex-wrap:wrap;}
.card{background:#fff;border-radius:10px;padding:14px 18px;min-width:100px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.card .num{font-size:26px;font-weight:700;}
.card .lbl{font-size:12px;color:#888;margin-top:4px;}
.card.red .num{color:#ea4335;}
.card.orange .num{color:#f57c00;}
.card.green .num{color:#34a853;}
.card.blue .num{color:#1a73e8;}
.card.gray .num{color:#999;}
/* Person stats */
.person-section{padding:12px 24px 0;}
.person-section h2{font-size:15px;font-weight:600;margin-bottom:10px;color:#444;}
.person-table{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.person-table table{width:100%;border-collapse:collapse;font-size:13px;}
.person-table th{background:#f8f9fa;padding:9px 14px;text-align:center;font-weight:600;color:#555;border-bottom:1px solid #eee;}
.person-table td{padding:8px 14px;text-align:center;border-bottom:1px solid #f5f5f5;}
.person-table tr:last-child td{border-bottom:none;}
.person-table .name-cell{text-align:left;font-weight:500;}
.overdue-name{color:#ea4335;font-weight:700;}
/* Main table */
.main-section{padding:14px 24px 24px;}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.toolbar-left{display:flex;align-items:center;gap:8px;}
.toolbar-right{display:flex;align-items:center;gap:8px;}
.filter-select{padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;color:#333;}
.search-input{padding:6px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;width:160px;}
.items-table{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.items-table table{width:100%;border-collapse:collapse;font-size:13px;}
.items-table th{background:#f8f9fa;padding:10px 12px;text-align:center;font-weight:600;color:#555;border-bottom:2px solid #e8e8e8;white-space:nowrap;}
.items-table td{padding:9px 12px;border-bottom:1px solid #f0f0f0;vertical-align:top;}
.items-table tr:hover td{background:#fafbff;}
.items-table .td-item{max-width:220px;word-break:break-all;line-height:1.5;}
.items-table .td-submit{max-width:200px;word-break:break-all;font-size:12px;color:#555;line-height:1.5;white-space:pre-wrap;}
.items-table .td-progress{max-width:200px;word-break:break-all;font-size:12px;color:#555;line-height:1.5;white-space:pre-wrap;}
/* Status badges */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:500;white-space:nowrap;}
.badge-done{background:#e6f4ea;color:#1e7e34;}
.badge-pending{background:#fce8e6;color:#c62828;}
.badge-suspended{background:#fff3e0;color:#e65100;}
.badge-overdue{background:#fce8e6;color:#c62828;border:1px solid #ea4335;}
.badge-near{background:#fff8e1;color:#f57c00;}
.badge-normal{background:#e8f0fe;color:#1a73e8;}
/* DDL coloring */
.ddl-overdue{color:#ea4335;font-weight:600;}
.ddl-near{color:#f57c00;font-weight:600;}
.ddl-done{color:#34a853;}
/* Actions */
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:12px;padding:28px 32px;width:580px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal h2{font-size:17px;font-weight:700;margin-bottom:20px;color:#222;}
.form-row{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
.form-group{flex:1;min-width:200px;}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:5px;color:#555;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;color:#333;font-family:inherit;}
.form-group textarea{resize:vertical;min-height:70px;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#1a73e8;}
.modal-footer{margin-top:20px;display:flex;justify-content:flex-end;gap:10px;}
/* Login modal */
.login-modal{width:360px;}
/* Log modal */
.log-modal{width:750px;}
.log-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px;}
.log-table th{background:#f5f5f5;padding:8px 10px;text-align:left;font-weight:600;border-bottom:1px solid #eee;}
.log-table td{padding:7px 10px;border-bottom:1px solid #f5f5f5;vertical-align:top;}
.log-table tr:last-child td{border-bottom:none;}
/* User indicator */
.user-badge{padding:4px 12px;background:rgba(255,255,255,.15);border-radius:16px;font-size:13px;cursor:pointer;}
.user-badge:hover{background:rgba(255,255,255,.25);}
/* Tabs for login */
.tab-bar{display:flex;gap:0;border-bottom:2px solid #e8e8e8;margin-bottom:18px;}
.tab{padding:8px 18px;cursor:pointer;font-size:14px;font-weight:500;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;}
.tab.active{color:#1a73e8;border-bottom-color:#1a73e8;}
/* Upload area */
.upload-area{border:2px dashed #ccc;border-radius:8px;padding:24px;text-align:center;color:#999;cursor:pointer;transition:.2s;}
.upload-area:hover,.upload-area.drag{border-color:#1a73e8;color:#1a73e8;background:#f0f4ff;}
/* tooltip for submit_url */
.submit-link{color:#1a73e8;text-decoration:none;font-size:12px;}
.submit-link:hover{text-decoration:underline;}
/* responsive tag */
.tag-overdue{background:#fce8e6;color:#c62828;border:1px solid #f5c2c0;padding:1px 6px;border-radius:4px;font-size:11px;}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>和控代理事项闭环看板</h1>
  <div class="header-right">
    <span id="userBadge" class="user-badge" onclick="openLoginModal()">游客 ▾</span>
    <span id="adminTools" style="display:none;display:flex;gap:8px;" class="header-tools">
      <button class="btn btn-outline btn-sm" onclick="openLogModal()">📋 操作日志</button>
      <button class="btn btn-success btn-sm" onclick="openAddModal()">＋ 新增事项</button>
      <button class="btn btn-outline btn-sm" onclick="downloadTemplate()">⬇ 下载模板</button>
      <button class="btn btn-outline btn-sm" onclick="openBatchModal()">⬆ 批量上传</button>
    </span>
  </div>
</div>

<!-- Summary cards -->
<div class="summary" id="summaryCards"></div>

<!-- Person stats -->
<div class="person-section">
  <h2>按责任人统计</h2>
  <div class="person-table" id="personTable"></div>
</div>

<!-- Main table -->
<div class="main-section">
  <div class="toolbar">
    <div class="toolbar-left">
      <select class="filter-select" id="filterStatus" onchange="renderTable()">
        <option value="">全部状态</option>
        <option value="未完成">未完成</option>
        <option value="完成">完成</option>
        <option value="挂起">挂起</option>
      </select>
      <select class="filter-select" id="filterPerson" onchange="renderTable()">
        <option value="">全部责任人</option>
      </select>
      <select class="filter-select" id="filterLivox" onchange="renderTable()">
        <option value="">全部LIVOX对接人</option>
      </select>
      <input class="search-input" id="searchInput" placeholder="搜索事项..." oninput="renderTable()">
    </div>
    <div class="toolbar-right">
      <span id="tableCount" style="font-size:13px;color:#888;"></span>
    </div>
  </div>
  <div class="items-table">
    <table id="mainTable">
      <thead>
        <tr>
          <th>序号</th>
          <th>事项</th>
          <th>提交物需求</th>
          <th>DDL</th>
          <th>责任人</th>
          <th>LIVOX对接人</th>
          <th>进展/闭环情况</th>
          <th>提交物</th>
          <th>闭环状态</th>
          <th>LIVOX确认</th>
          <th>更新时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- ───── Login Modal ───── -->
<div class="overlay" id="loginOverlay">
  <div class="modal login-modal">
    <h2>登录</h2>
    <div class="tab-bar">
      <div class="tab active" id="tabPerson" onclick="switchTab('person')">责任人登录</div>
      <div class="tab" id="tabAdmin" onclick="switchTab('admin')">管理员登录</div>
    </div>
    <div id="panelPerson">
      <div class="form-group" style="margin-bottom:14px;">
        <label>姓名</label>
        <input id="loginName" placeholder="输入您的姓名" onkeydown="if(event.key==='Enter')loginPerson()">
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('loginOverlay')">取消</button>
        <button class="btn btn-primary" onclick="loginPerson()">确认</button>
      </div>
    </div>
    <div id="panelAdmin" style="display:none;">
      <div class="form-group" style="margin-bottom:14px;">
        <label>管理员密码</label>
        <input id="adminPwd" type="password" placeholder="输入管理员密码" onkeydown="if(event.key==='Enter')loginAdmin()">
      </div>
      <div id="adminErr" style="color:#ea4335;font-size:13px;margin-bottom:8px;"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('loginOverlay')">取消</button>
        <button class="btn btn-primary" onclick="loginAdmin()">登录</button>
      </div>
    </div>
  </div>
</div>

<!-- ───── Public Fill Modal ───── -->
<div class="overlay" id="fillOverlay">
  <div class="modal">
    <h2 id="fillTitle">填写进展</h2>
    <input type="hidden" id="fillId">
    <div class="form-row">
      <div class="form-group">
        <label>责任人</label>
        <input id="fillPerson" placeholder="姓名">
      </div>
      <div class="form-group">
        <label>闭环状态</label>
        <select id="fillStatus">
          <option value="未完成">未完成</option>
          <option value="完成">完成</option>
          <option value="挂起">挂起</option>
        </select>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>进展/闭环情况</label>
      <textarea id="fillProgress" rows="3" placeholder="填写进展说明..."></textarea>
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>提交物链接/说明</label>
      <input id="fillSubmitUrl" placeholder="链接或文件名">
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('fillOverlay')">取消</button>
      <button class="btn btn-primary" onclick="submitFill()">提交</button>
    </div>
  </div>
</div>

<!-- ───── Edit Modal (Admin) ───── -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <h2>编辑事项</h2>
    <input type="hidden" id="editId">
    <div class="form-row">
      <div class="form-group">
        <label>日期</label>
        <input id="editDate" type="date">
      </div>
      <div class="form-group">
        <label>DDL</label>
        <input id="editDdl" placeholder="如 2026-08-15 或 每月31日">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>事项</label>
      <input id="editItem" placeholder="事项名称">
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>提交物需求</label>
      <textarea id="editSubmit" rows="3"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>责任人</label>
        <input id="editPerson" placeholder="姓名，多人用/分隔">
      </div>
      <div class="form-group">
        <label>LIVOX对接人</label>
        <input id="editLivox" placeholder="Dandy/Nathan等">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>进展/闭环情况</label>
      <textarea id="editProgress" rows="3"></textarea>
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>提交物链接/说明</label>
      <input id="editSubmitUrl" placeholder="链接或文件名">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>闭环状态</label>
        <select id="editStatus">
          <option value="未完成">未完成</option>
          <option value="完成">完成</option>
          <option value="挂起">挂起</option>
        </select>
      </div>
      <div class="form-group">
        <label>LIVOX确认</label>
        <select id="editLivoxConfirm">
          <option value="未完成">未完成</option>
          <option value="完成">完成</option>
          <option value="挂起">挂起</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('editOverlay')">取消</button>
      <button class="btn btn-primary" onclick="submitEdit()">保存</button>
    </div>
  </div>
</div>

<!-- ───── Add Modal ───── -->
<div class="overlay" id="addOverlay">
  <div class="modal">
    <h2>新增事项</h2>
    <div class="form-row">
      <div class="form-group">
        <label>日期</label>
        <input id="addDate" type="date">
      </div>
      <div class="form-group">
        <label>DDL</label>
        <input id="addDdl" placeholder="如 2026-08-15 或 每月31日">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>事项 <span style="color:#ea4335">*</span></label>
      <input id="addItem" placeholder="事项名称">
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>提交物需求</label>
      <textarea id="addSubmit" rows="3"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>责任人</label>
        <input id="addPerson" placeholder="姓名，多人用/分隔">
      </div>
      <div class="form-group">
        <label>LIVOX对接人</label>
        <input id="addLivox" placeholder="Dandy/Nathan等">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>进展/闭环情况</label>
      <textarea id="addProgress" rows="2"></textarea>
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>提交物链接/说明</label>
      <input id="addSubmitUrl" placeholder="链接或文件名">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>闭环状态</label>
        <select id="addStatus">
          <option value="未完成">未完成</option>
          <option value="完成">完成</option>
          <option value="挂起">挂起</option>
        </select>
      </div>
      <div class="form-group">
        <label>LIVOX确认</label>
        <select id="addLivoxConfirm">
          <option value="未完成">未完成</option>
          <option value="完成">完成</option>
          <option value="挂起">挂起</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('addOverlay')">取消</button>
      <button class="btn btn-primary" onclick="submitAdd()">新增</button>
    </div>
  </div>
</div>

<!-- ───── Log Modal ───── -->
<div class="overlay" id="logOverlay">
  <div class="modal log-modal">
    <h2>操作日志</h2>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input class="search-input" id="logSearch" placeholder="搜索日志..." oninput="renderLog()" style="flex:1;">
      <button class="btn btn-outline btn-sm" onclick="loadLog()">刷新</button>
    </div>
    <div id="logContent"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('logOverlay')">关闭</button>
    </div>
  </div>
</div>

<!-- ───── Batch Upload Modal ───── -->
<div class="overlay" id="batchOverlay">
  <div class="modal">
    <h2>批量上传</h2>
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()"
         ondragover="event.preventDefault();this.classList.add('drag')"
         ondragleave="this.classList.remove('drag')"
         ondrop="handleDrop(event)">
      <div>📂 点击或拖拽 Excel 文件至此处</div>
      <div style="font-size:12px;margin-top:6px;color:#aaa;">支持 .xlsx 格式，从第2行起填数据</div>
      <input type="file" id="fileInput" accept=".xlsx" style="display:none" onchange="handleFile(this.files[0])">
    </div>
    <div id="batchPreview" style="margin-top:14px;"></div>
    <div id="batchErr" style="color:#ea4335;font-size:13px;margin-top:8px;"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('batchOverlay')">取消</button>
      <button class="btn btn-primary" id="batchConfirmBtn" style="display:none" onclick="confirmBatch()">确认导入</button>
    </div>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
var S = {
  rows: [],
  role: 'guest',   // guest | person | admin
  name: '',
  token: '',
  logRows: [],
  batchItems: [],
};

// ─── Init ────────────────────────────────────────────────────────────────────
async function init() {
  await loadData();
  // Set today's date in add form
  document.getElementById('addDate').value = new Date().toISOString().slice(0,10);
  updateUserBadge();
}

async function loadData() {
  try {
    var resp = await fetch('/api/data');
    S.rows = await resp.json();
    renderAll();
  } catch(e) {
    console.error('加载失败', e);
  }
}

function renderAll() {
  renderSummary();
  renderPersonTable();
  renderTable();
  populateFilters();
}

// ─── Date helpers ────────────────────────────────────────────────────────────
function parseDdl(ddl) {
  if (!ddl) return null;
  var d = new Date(ddl);
  if (!isNaN(d.getTime())) return d;
  return null;
}

function today() {
  var d = new Date(); d.setHours(0,0,0,0); return d;
}

function ddlStatus(row) {
  // periodic items: ddl contains '月' or '周' or '每'
  var ddl = row.ddl || '';
  if (/每|月|周/.test(ddl)) return 'periodic';
  var d = parseDdl(ddl);
  if (!d) return 'none';
  var now = today();
  var diff = Math.floor((d - now) / 86400000);
  if (row.status === '完成' && row.livox_confirm === '完成') return 'done';
  if (diff < 0) return 'overdue';
  if (diff <= 3) return 'near';
  return 'normal';
}

// ─── Summary ─────────────────────────────────────────────────────────────────
function renderSummary() {
  var rows = S.rows;
  var total = rows.length;
  var done = rows.filter(r => r.status === '完成' && r.livox_confirm === '完成').length;
  var suspended = rows.filter(r => r.status === '挂起').length;
  var periodic = rows.filter(r => /每|月|周/.test(r.ddl || '')).length;
  var key = rows.filter(r => {
    var ddl = r.ddl || '';
    if (/每|月|周/.test(ddl)) return false;
    return parseDdl(ddl) !== null;
  }).length;
  var overdue = rows.filter(r => ddlStatus(r) === 'overdue').length;
  var near = rows.filter(r => ddlStatus(r) === 'near').length;
  var inprogress = rows.filter(r => r.status === '未完成' && ddlStatus(r) !== 'overdue').length;

  var cards = [
    {lbl:'待办总数', num:total, cls:'blue'},
    {lbl:'点状待办', num:periodic, cls:''},
    {lbl:'重点事项', num:key, cls:''},
    {lbl:'已完成', num:done, cls:'green'},
    {lbl:'挂起', num:suspended, cls:'gray'},
    {lbl:'进行中', num:inprogress, cls:'red'},
    {lbl:'临期(≤3天)', num:near, cls:'orange'},
    {lbl:'逾期', num:overdue, cls:'red'},
  ];

  document.getElementById('summaryCards').innerHTML = cards.map(c =>
    '<div class="card '+c.cls+'"><div class="num">'+c.num+'</div><div class="lbl">'+c.lbl+'</div></div>'
  ).join('');
}

// ─── Person Table ─────────────────────────────────────────────────────────────
function renderPersonTable() {
  var rows = S.rows;
  var persons = {};
  rows.forEach(function(r) {
    var ps = (r.person || '未分配').split('/');
    ps.forEach(function(p) {
      p = p.trim();
      if (!p) p = '未分配';
      if (!persons[p]) persons[p] = {name:p, total:0, done:0, suspended:0, inprogress:0, overdue:0, near:0, periodic:0};
      var obj = persons[p];
      obj.total++;
      var st = ddlStatus(r);
      if (r.status==='完成' && r.livox_confirm==='完成') obj.done++;
      else if (r.status==='挂起') obj.suspended++;
      else obj.inprogress++;
      if (st==='overdue') obj.overdue++;
      if (st==='near') obj.near++;
      if (st==='periodic') obj.periodic++;
    });
  });

  var pList = Object.values(persons);
  // totals row
  var totals = {total:0,done:0,suspended:0,inprogress:0,overdue:0,near:0};
  pList.forEach(function(p){
    totals.total+=p.total; totals.done+=p.done; totals.suspended+=p.suspended;
    totals.inprogress+=p.inprogress; totals.overdue+=p.overdue; totals.near+=p.near;
  });

  var html = '<table><thead><tr>' +
    '<th>责任人</th><th>待办总数</th><th>已完成</th><th>挂起</th><th>进行中</th><th>逾期</th><th>临期</th>' +
    '</tr></thead><tbody>';

  pList.forEach(function(p) {
    var nameClass = p.overdue > 0 ? 'overdue-name' : '';
    html += '<tr>' +
      '<td class="name-cell '+nameClass+'">'+esc(p.name)+'</td>' +
      '<td>'+p.total+'</td><td>'+p.done+'</td><td>'+p.suspended+'</td><td>'+p.inprogress+'</td>' +
      '<td>'+(p.overdue>0?'<span style="color:#ea4335;font-weight:700">'+p.overdue+'</span>':'0')+'</td>' +
      '<td>'+p.near+'</td>' +
      '</tr>';
  });

  html += '<tr style="font-weight:700;background:#f8f9fa;">' +
    '<td class="name-cell">合计</td>' +
    '<td>'+totals.total+'</td><td>'+totals.done+'</td><td>'+totals.suspended+'</td><td>'+totals.inprogress+'</td>' +
    '<td>'+(totals.overdue>0?'<span style="color:#ea4335">'+totals.overdue+'</span>':'0')+'</td>' +
    '<td>'+totals.near+'</td>' +
    '</tr>';

  html += '</tbody></table>';
  document.getElementById('personTable').innerHTML = html;
}

// ─── Main Table ───────────────────────────────────────────────────────────────
function populateFilters() {
  var persons = [...new Set(S.rows.flatMap(r => (r.person||'').split('/').map(p=>p.trim()).filter(Boolean)))].sort();
  var livoxes = [...new Set(S.rows.map(r=>r.livox||'').filter(Boolean))].sort();
  var fp = document.getElementById('filterPerson');
  var curP = fp.value;
  fp.innerHTML = '<option value="">全部责任人</option>' + persons.map(p=>'<option value="'+p+'">'+esc(p)+'</option>').join('');
  fp.value = curP;
  var fl = document.getElementById('filterLivox');
  var curL = fl.value;
  fl.innerHTML = '<option value="">全部LIVOX对接人</option>' + livoxes.map(l=>'<option value="'+l+'">'+esc(l)+'</option>').join('');
  fl.value = curL;
}

function renderTable() {
  var statusF = document.getElementById('filterStatus').value;
  var personF = document.getElementById('filterPerson').value;
  var livoxF  = document.getElementById('filterLivox').value;
  var search  = document.getElementById('searchInput').value.trim().toLowerCase();

  var rows = S.rows.filter(function(r) {
    if (statusF && r.status !== statusF) return false;
    if (personF && !(r.person||'').split('/').map(p=>p.trim()).includes(personF)) return false;
    if (livoxF  && r.livox !== livoxF) return false;
    if (search) {
      var hay = [r.item,r.submit,r.person,r.progress,r.ddl,r.livox].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  document.getElementById('tableCount').textContent = '共 '+rows.length+' 条';

  var html = '';
  rows.forEach(function(r, idx) {
    var st = ddlStatus(r);
    var ddlClass = st==='overdue'?'ddl-overdue':st==='near'?'ddl-near':st==='done'?'ddl-done':'';
    var statusBadge = r.status==='完成'?'badge-done':r.status==='挂起'?'badge-suspended':'badge-pending';
    var lcBadge = r.livox_confirm==='完成'?'badge-done':r.livox_confirm==='挂起'?'badge-suspended':'badge-pending';

    var submitUrlHtml = '';
    if (r.submit_url) {
      var url = r.submit_url;
      if (url.startsWith('http')) {
        submitUrlHtml = '<a class="submit-link" href="'+esc(url)+'" target="_blank">🔗 查看</a>';
      } else {
        submitUrlHtml = '<span style="font-size:12px;color:#555;">'+esc(url)+'</span>';
      }
    }

    var actions = '<div class="actions">';
    actions += '<button class="btn btn-outline btn-sm" onclick="openFillModal('+r.id+')">✏ 填写</button>';
    if (S.role === 'admin') {
      actions += '<button class="btn btn-outline btn-sm" onclick="openEditModal('+r.id+')">✎ 编辑</button>';
      actions += '<button class="btn btn-danger btn-sm" onclick="deleteItem('+r.id+')">🗑</button>';
    }
    actions += '</div>';

    // overdue tag
    var overdueTag = st==='overdue'?'<span class="tag-overdue">逾期</span> ':'';

    html += '<tr>' +
      '<td style="text-align:center;color:#999;font-size:12px;">'+r.id+'</td>' +
      '<td class="td-item">'+overdueTag+esc(r.item)+'</td>' +
      '<td class="td-submit">'+esc(r.submit||'')+'</td>' +
      '<td style="white-space:nowrap;text-align:center;" class="'+ddlClass+'">'+esc(r.ddl||'-')+'</td>' +
      '<td style="text-align:center;">'+esc(r.person||'-')+'</td>' +
      '<td style="text-align:center;">'+esc(r.livox||'-')+'</td>' +
      '<td class="td-progress">'+esc(r.progress||'')+'</td>' +
      '<td style="text-align:center;">'+submitUrlHtml+'</td>' +
      '<td style="text-align:center;"><span class="badge '+statusBadge+'">'+esc(r.status||'未完成')+'</span></td>' +
      '<td style="text-align:center;"><span class="badge '+lcBadge+'">'+esc(r.livox_confirm||'未完成')+'</span></td>' +
      '<td style="text-align:center;font-size:11px;color:#aaa;white-space:nowrap;">'+esc(r.updated_at||'')+(r.updated_by?'<br>'+esc(r.updated_by):'')+'</td>' +
      '<td>'+actions+'</td>' +
      '</tr>';
  });

  document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="12" style="text-align:center;padding:24px;color:#aaa;">暂无数据</td></tr>';
}

// ─── Auth ─────────────────────────────────────────────────────────────────────
function updateUserBadge() {
  var badge = document.getElementById('userBadge');
  var adminTools = document.getElementById('adminTools');
  if (S.role === 'admin') {
    badge.textContent = '管理员 ▾';
    adminTools.style.display = 'flex';
  } else if (S.role === 'person') {
    badge.textContent = S.name + ' ▾';
    adminTools.style.display = 'none';
  } else {
    badge.textContent = '游客 ▾';
    adminTools.style.display = 'none';
  }
}

function openLoginModal() {
  document.getElementById('loginName').value = S.name || '';
  document.getElementById('adminPwd').value = '';
  document.getElementById('adminErr').textContent = '';
  switchTab('person');
  document.getElementById('loginOverlay').classList.add('show');
}

function switchTab(tab) {
  document.getElementById('tabPerson').classList.toggle('active', tab==='person');
  document.getElementById('tabAdmin').classList.toggle('active', tab==='admin');
  document.getElementById('panelPerson').style.display = tab==='person'?'':'none';
  document.getElementById('panelAdmin').style.display  = tab==='admin'?'':'none';
}

function loginPerson() {
  var name = document.getElementById('loginName').value.trim();
  if (!name) { alert('请输入姓名'); return; }
  S.role = 'person'; S.name = name; S.token = '';
  closeModal('loginOverlay');
  updateUserBadge();
}

async function loginAdmin() {
  var pwd = document.getElementById('adminPwd').value;
  try {
    var resp = await fetch('/api/auth', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pwd})
    });
    var data = await resp.json();
    if (data.ok) {
      S.role='admin'; S.token=data.token; S.name='管理员';
      closeModal('loginOverlay');
      updateUserBadge();
    } else {
      document.getElementById('adminErr').textContent = data.msg || '密码错误';
    }
  } catch(e) {
    document.getElementById('adminErr').textContent = '请求失败';
  }
}

// ─── Fill Modal ───────────────────────────────────────────────────────────────
function openFillModal(id) {
  var row = S.rows.find(r=>r.id===id);
  if (!row) return;
  document.getElementById('fillId').value = id;
  document.getElementById('fillTitle').textContent = '填写进展 — ' + (row.item||'').slice(0,30);
  document.getElementById('fillPerson').value = row.person || (S.name||'');
  document.getElementById('fillProgress').value = row.progress || '';
  document.getElementById('fillSubmitUrl').value = row.submit_url || '';
  document.getElementById('fillStatus').value = row.status || '未完成';
  document.getElementById('fillOverlay').classList.add('show');
}

async function submitFill() {
  var id = parseInt(document.getElementById('fillId').value);
  var body = {
    person: document.getElementById('fillPerson').value.trim(),
    progress: document.getElementById('fillProgress').value.trim(),
    submit_url: document.getElementById('fillSubmitUrl').value.trim(),
    status: document.getElementById('fillStatus').value,
    caller: S.name || '匿名',
  };
  try {
    var resp = await fetch('/api/public_update/'+id, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'X-Person': encodeURIComponent(S.name||'匿名'),
      },
      body: JSON.stringify(body)
    });
    var data = await resp.json();
    if (data.ok) {
      closeModal('fillOverlay');
      await loadData();
    } else {
      alert(data.error || '提交失败');
    }
  } catch(e) {
    alert('提交失败: '+e.message);
  }
}

// ─── Log ──────────────────────────────────────────────────────────────────────
async function loadLog() {
  try {
    var resp = await fetch('/api/log', {
      headers:{'X-Admin-Token': S.token}
    });
    S.logRows = await resp.json();
    renderLog();
  } catch(e) {
    document.getElementById('logContent').innerHTML = '<p style="color:#ea4335">加载失败</p>';
  }
}

function renderLog() {
  var q = document.getElementById('logSearch').value.trim().toLowerCase();
  var logs = S.logRows;
  if (q) logs = logs.filter(l => JSON.stringify(l).toLowerCase().includes(q));
  if (!logs.length) {
    document.getElementById('logContent').innerHTML = '<p style="color:#aaa;text-align:center;padding:20px;">暂无日志</p>';
    return;
  }
  var html = '<table class="log-table"><thead><tr><th>时间</th><th>操作人</th><th>操作</th><th>事项</th><th>变更详情</th></tr></thead><tbody>';
  logs.slice(0,200).forEach(function(l) {
    var changed = l.changed || {};
    var changedStr = Object.entries(changed).map(([k,v])=>'['+k+']: '+v.old+' → '+v.new).join('\n') || '-';
    html += '<tr>' +
      '<td style="white-space:nowrap;">'+esc(l.time||'')+'</td>' +
      '<td>'+esc(l.caller||'')+'</td>' +
      '<td><span class="badge badge-normal">'+esc(l.op||'')+'</span></td>' +
      '<td style="max-width:200px;word-break:break-all;">'+esc((l.item||'').slice(0,50))+'</td>' +
      '<td style="white-space:pre-wrap;font-size:11px;color:#777;">'+esc(changedStr)+'</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('logContent').innerHTML = html;
}

function openLogModal() {
  document.getElementById('logOverlay').classList.add('show');
  loadLog();
}

// ─── Batch Upload ─────────────────────────────────────────────────────────────
function openBatchModal() {
  S.batchItems = [];
  document.getElementById('batchPreview').innerHTML = '';
  document.getElementById('batchErr').textContent = '';
  document.getElementById('batchConfirmBtn').style.display = 'none';
  document.getElementById('fileInput').value = '';
  document.getElementById('batchOverlay').classList.add('show');
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadArea').classList.remove('drag');
  var f = e.dataTransfer.files[0];
  if (f) handleFile(f);
}

async function handleFile(file) {
  if (!file) return;
  document.getElementById('batchErr').textContent = '';
  document.getElementById('batchPreview').innerHTML = '<p style="color:#aaa;">解析中...</p>';
  document.getElementById('batchConfirmBtn').style.display = 'none';

  var reader = new FileReader();
  reader.onload = async function(e) {
    var b64 = btoa(String.fromCharCode(...new Uint8Array(e.target.result)));
    try {
      var resp = await fetch('/api/batch_add', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'X-Admin-Token': S.token,
          'X-Person': encodeURIComponent(S.name||'管理员'),
        },
        body: JSON.stringify({excel_b64: b64, parse_only: true})
      });
      var data = await resp.json();
      if (!data.ok) { document.getElementById('batchErr').textContent = data.error||'解析失败'; return; }
      S.batchItems = data.preview || [];
      renderBatchPreview(S.batchItems);
      if (S.batchItems.length > 0) document.getElementById('batchConfirmBtn').style.display = '';
    } catch(err) {
      document.getElementById('batchErr').textContent = '解析失败: '+err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderBatchPreview(items) {
  if (!items.length) {
    document.getElementById('batchPreview').innerHTML = '<p style="color:#aaa;">未解析到数据</p>';
    return;
  }
  var html = '<p style="font-size:13px;color:#555;margin-bottom:8px;">解析到 '+items.length+' 条，确认后导入：</p>';
  html += '<div style="max-height:200px;overflow-y:auto;border:1px solid #eee;border-radius:6px;">';
  html += '<table style="width:100%;font-size:12px;border-collapse:collapse;">';
  html += '<tr style="background:#f5f5f5;"><th style="padding:6px 8px;">事项</th><th>DDL</th><th>责任人</th></tr>';
  items.forEach(function(it) {
    html += '<tr style="border-top:1px solid #f0f0f0;"><td style="padding:5px 8px;">'+esc(it.item||'')+'</td><td style="padding:5px 8px;">'+esc(it.ddl||'')+'</td><td style="padding:5px 8px;">'+esc(it.person||'')+'</td></tr>';
  });
  html += '</table></div>';
  document.getElementById('batchPreview').innerHTML = html;
}

async function confirmBatch() {
  if (!S.batchItems.length) return;
  try {
    var resp = await fetch('/api/batch_add', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'X-Admin-Token': S.token,
        'X-Person': encodeURIComponent(S.name||'管理员'),
      },
      body: JSON.stringify({items: S.batchItems})
    });
    var data = await resp.json();
    if (data.ok) {
      alert('成功导入 '+data.count+' 条');
      closeModal('batchOverlay');
      await loadData();
    } else {
      alert(data.error || '导入失败');
    }
  } catch(e) {
    alert('导入失败: '+e.message);
  }
}

function downloadTemplate() {
  window.open('/api/template','_blank');
}

// ─── Utils ────────────────────────────────────────────────────────────────────
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

// Close on overlay click
document.querySelectorAll('.overlay').forEach(function(el) {
  el.addEventListener('click', function(e) {
    if (e.target === el) el.classList.remove('show');
  });
});

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
